<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ArgumentCraft — Sign In</title>
  <meta name="description" content="Debate with an AI buddy. Build stronger arguments.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
:root{
  --bg:#f7f1e8; --bg-deep:#efe5d8; --ink:#24160f; --ink-2:#5d4b40; --brown:#3b2116;
  --glass:rgba(255,252,247,.56); --glass-b:rgba(255,255,255,.68); --line:rgba(59,33,22,.1);
  --accent:#8a5a3b; --accent-soft:#d7b894; --gold:#c9a45c; --ease:cubic-bezier(.22,1,.36,1); --err:#a34b43;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:"Inter Tight",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.ambient::before,.ambient::after{content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.5}
.ambient::before{width:58vw;height:58vw;left:-12vw;top:-18vw;background:radial-gradient(circle,rgba(215,184,148,.42),rgba(215,184,148,0) 68%);animation:driftA 18s var(--ease) infinite alternate}
.ambient::after{width:48vw;height:48vw;right:-10vw;bottom:-16vw;background:radial-gradient(circle,rgba(138,90,59,.16),rgba(138,90,59,0) 70%);animation:driftB 22s var(--ease) infinite alternate}
@keyframes driftA{from{transform:translate(0,0) scale(1)}to{transform:translate(4vw,3vw) scale(1.06)}}
@keyframes driftB{from{transform:translate(0,0) scale(1)}to{transform:translate(-3vw,-4vw) scale(1.08)}}
.page{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:minmax(360px,52%) minmax(400px,520px);align-items:center;gap:clamp(18px,2.8vw,40px);padding:28px clamp(18px,3.2vw,44px)}
.auth-card{justify-self:start;width:100%;max-width:520px;min-width:0;margin-left:clamp(0px,1.5vw,22px)}
.hero{padding-left:clamp(12px,3vw,36px);min-width:0}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.brand svg{width:36px;height:36px;fill:var(--ink);flex:none}
.brand span{font-size:21px;font-weight:500;letter-spacing:-.03em;overflow-wrap:anywhere}
.hero h1{font-size:clamp(40px,5.4vw,68px);font-weight:300;letter-spacing:-.045em;line-height:1.04;overflow-wrap:anywhere}
.hero h1 strong{font-weight:500}
.hero h1 i{font-style:italic;color:var(--brown)}
.hero p{margin-top:16px;font-size:16px;line-height:1.7;color:var(--ink-2);max-width:54ch;overflow-wrap:anywhere}

/* Staged scene: no frame, no scrolling */
.scene{position:relative;height:430px;margin-top:16px;margin-left:-8px;background:transparent;border:0;box-shadow:none;border-radius:0;overflow:visible;min-width:0}
.scene-svg{width:100%;height:100%;display:block;overflow:visible}
.act{opacity:0;transition:opacity .8s var(--ease)}
.act1{animation:show1 24s var(--ease) infinite}
.act2{animation:show2 24s var(--ease) infinite}
.act3{animation:show3 24s var(--ease) infinite}
.caption1{animation:cap1 24s var(--ease) infinite}
.caption2{animation:cap2 24s var(--ease) infinite}
.caption3{animation:cap3 24s var(--ease) infinite}
@keyframes show1{0%,4%{opacity:0}8%,30%{opacity:1}36%,100%{opacity:0}}
@keyframes show2{0%,36%{opacity:0}42%,63%{opacity:1}69%,100%{opacity:0}}
@keyframes show3{0%,69%{opacity:0}75%,96%{opacity:1}100%{opacity:0}}
@keyframes cap1{0%,6%{opacity:0;transform:translateY(4px)}10%,30%{opacity:1;transform:translateY(0)}36%,100%{opacity:0;transform:translateY(-2px)}}
@keyframes cap2{0%,38%{opacity:0;transform:translateY(4px)}44%,63%{opacity:1;transform:translateY(0)}69%,100%{opacity:0;transform:translateY(-2px)}}
@keyframes cap3{0%,71%{opacity:0;transform:translateY(4px)}77%,96%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-2px)}}
.scene-float{animation:sceneFloat 9s var(--ease) infinite;transform-origin:260px 190px}
@keyframes sceneFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* Auth card */
.auth-card{background:var(--glass);border:1px solid var(--glass-b);border-radius:28px;padding:22px;backdrop-filter:blur(22px) saturate(130%);-webkit-backdrop-filter:blur(22px) saturate(130%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 30px 60px -36px rgba(40,20,10,.3)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(42,26,18,.05);padding:5px;border-radius:16px;margin-bottom:16px}
.tab{border:0;background:transparent;border-radius:12px;padding:11px 10px;font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:all .25s var(--ease);min-width:0;overflow-wrap:anywhere}
.tab.active{background:rgba(255,253,249,.92);color:var(--ink);box-shadow:0 6px 16px -12px rgba(40,20,10,.25)}
.panel{display:none}.panel.active{display:block}
.panel h2{font-size:24px;font-weight:400;letter-spacing:-.03em;margin-bottom:4px;overflow-wrap:anywhere}
.panel .hint{font-size:13px;color:var(--ink-2);margin-bottom:14px;line-height:1.45;overflow-wrap:anywhere}
form{display:grid;gap:11px}
label{display:grid;gap:5px;font-size:11px;color:#6a594d;text-transform:uppercase;letter-spacing:.04em;overflow-wrap:anywhere}
input{width:100%;min-width:0;border:1px solid rgba(42,26,18,.1);border-radius:14px;background:rgba(255,253,249,.82);color:var(--ink);padding:12px 13px;font-size:14px;transition:border-color .25s var(--ease),box-shadow .25s var(--ease),background .25s}
input:focus{outline:none;border-color:rgba(59,33,22,.28);background:#fff;box-shadow:0 0 0 4px rgba(138,90,59,.08)}
.btn{width:100%;margin-top:4px;border:0;border-radius:999px;padding:13px 18px;font:inherit;font-size:12.5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;background:var(--brown);color:#f7efe4;transition:transform .22s var(--ease),box-shadow .3s var(--ease),filter .25s;position:relative;overflow:hidden;white-space:normal;line-height:1.25}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px -16px rgba(59,33,22,.5);filter:brightness(1.02)}
.btn:active{transform:translateY(0) scale(.985)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.msg{min-height:20px;font-size:13px;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}
.msg.err{color:var(--err)} .msg.ok{color:#4f725f}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0 6px;color:#8a7a6e;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.divider::before,.divider::after{content:"";height:1px;flex:1;background:var(--line)}
.demo{font-size:12.5px;color:var(--ink-2);line-height:1.55;background:rgba(42,26,18,.04);padding:11px 12px;border-radius:14px;overflow-wrap:anywhere}
.demo code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;background:rgba(255,253,249,.7);padding:1px 5px;border-radius:6px}
.already{display:none;margin-bottom:14px;padding:12px 13px;border-radius:16px;background:rgba(138,90,59,.08);border:1px solid rgba(138,90,59,.16);font-size:13px;color:var(--ink-2);line-height:1.45;overflow-wrap:anywhere}
.already strong{color:var(--brown)}
.already .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.link-btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:999px;text-decoration:none;font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:var(--brown);color:#f7efe4;max-width:100%;text-align:center}
.ghost-btn{border:1px solid rgba(42,26,18,.14);background:rgba(255,253,249,.7);color:var(--ink);padding:9px 14px;border-radius:999px;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;max-width:100%}

@media (max-width: 980px){
  .page{grid-template-columns:1fr;max-width:640px;margin:0 auto;padding-top:24px;padding-bottom:36px}
  .scene{height:340px;margin-top:12px;margin-left:-4px}
  .hero p{max-width:none}
  .auth-card{margin-left:0}
}
@media (max-width: 520px){
  .scene{height:270px}
  .auth-card{padding:18px;border-radius:22px}
  .hero h1{font-size:clamp(32px,9.5vw,44px)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .act1,.act2,.act3,.caption1,.caption2,.caption3,.scene-float{animation:none;opacity:1;transform:none}
  .act2,.act3,.caption2,.caption3{display:none}
}
  </style>
</head>
<body>
  <div class="ambient"></div>
  <main class="page">
    <section class="hero">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 5h13v13H5zM22 22h13v13H22z"/><path d="M22 5a13 13 0 0 1 13 13H22zM18 35A13 13 0 0 1 5 22h13z"/></svg>
        <span>ArgumentCraft</span>
      </div>
      <h1><strong>Argument Workshop</strong><br><i>Make reasoning visible</i></h1>
      <p>Debate with an AI buddy. Build stronger arguments.</p>

      <div class="scene" aria-hidden="true">
        <svg class="scene-svg" viewBox="0 0 520 340" preserveAspectRatio="xMinYMid meet" role="img">
          <defs>
            <radialGradient id="dome" cx="50%" cy="12%" r="62%"><stop offset="0" stop-color="#fffaf1" stop-opacity=".6"/><stop offset=".55" stop-color="#f5ecde" stop-opacity=".18"/><stop offset="1" stop-color="#f7f1e8" stop-opacity="0"/></radialGradient>
            <linearGradient id="marble" x1="0" x2="1"><stop offset="0" stop-color="#fcf7f0"/><stop offset="1" stop-color="#e8dccb"/></linearGradient>
            <linearGradient id="stone" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f3ebdf"/><stop offset="1" stop-color="#ddd0bd"/></linearGradient>
            <linearGradient id="robeA" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e8d8c3"/><stop offset="1" stop-color="#ccb89e"/></linearGradient>
            <linearGradient id="robeB" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e2d1bc"/><stop offset="1" stop-color="#c7b092"/></linearGradient>
            <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#d7b894" stop-opacity=".12"/><stop offset=".5" stop-color="#d1a95f"/><stop offset="1" stop-color="#d7b894" stop-opacity=".12"/></linearGradient>
            <linearGradient id="goldPath" x1="0" x2="1"><stop offset="0" stop-color="#c9a45c" stop-opacity=".15"/><stop offset=".25" stop-color="#d6b169"/><stop offset=".75" stop-color="#e0be74"/><stop offset="1" stop-color="#fff4d8" stop-opacity=".95"/></linearGradient>
            <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8"/></filter>
            <style>
              .arena-fill{fill:url(#stone);stroke:rgba(138,90,59,.13);stroke-width:1}
              .step{fill:none;stroke:rgba(138,90,59,.09);stroke-width:1}
              .dome-line{fill:none;stroke:rgba(138,90,59,.11);stroke-width:1}
              .aud{fill:rgba(138,90,59,.11)}
              .figA{fill:url(#robeA);stroke:rgba(59,33,22,.13);stroke-width:.75}
              .figB{fill:url(#robeB);stroke:rgba(59,33,22,.13);stroke-width:.75}
              .hd{fill:#f3e8d8;stroke:rgba(59,33,22,.11);stroke-width:.65}
              .shadow{fill:rgba(138,90,59,.07)}
              .cap{font:500 12.5px "Inter Tight",system-ui,sans-serif;fill:#5d4b40}
              .sub{font:400 8.5px "Inter Tight",system-ui,sans-serif;fill:rgba(138,90,59,.55)}
              @keyframes breathe{0%,100%{opacity:.18;transform:scale(.982)}50%{opacity:.48;transform:scale(1.018)}}
              @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-9px)}}
              @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,-7px)}}
              @keyframes float3{0%,100%{transform:translate(0,0)}50%{transform:translate(1px,-11px)}}
              @keyframes flick{0%,100%{opacity:.12}35%{opacity:.38}60%{opacity:.22}}
              @keyframes ray{0%,100%{opacity:.06}50%{opacity:.14}}
              @keyframes sway{0%,100%{transform:rotate(-4.5deg)}50%{transform:rotate(4.5deg)}}
              @keyframes clashL{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(5px,2px) rotate(2deg)}}
              @keyframes clashR{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-5px,-1px) rotate(-2deg)}}
              @keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.3)}15%{opacity:.95}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.15)}}
              @keyframes dash{to{stroke-dashoffset:-90}}
              @keyframes settle{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:.08;transform:translateY(7px)}}
              @keyframes gatePulse{0%,100%{opacity:.18}50%{opacity:.45}}
              @keyframes pathGlow{0%,100%{opacity:.75}50%{opacity:1}}
              .ringB{transform-origin:260px 286px;transform-box:fill-box;animation:breathe 4.4s ease-in-out infinite}
              .b1{animation:float1 5.6s ease-in-out infinite} .b2{animation:float2 6.2s ease-in-out infinite .4s} .b3{animation:float3 5s ease-in-out infinite .9s}
              .b4{animation:float2 6.8s ease-in-out infinite 1.3s} .b5{animation:float1 5.3s ease-in-out infinite 1.8s} .b6{animation:float3 6.5s ease-in-out infinite .2s}
              .fk{animation:flick 3.4s ease-in-out infinite}
              .ray{animation:ray 5s ease-in-out infinite}
              .scaleArm{transform-origin:260px 132px;transform-box:fill-box;animation:sway 3.4s ease-in-out infinite}
              .steadyArm{transform-origin:260px 132px;opacity:.8}
              .cl{animation:clashL 1.5s ease-in-out infinite} .cr{animation:clashR 1.5s ease-in-out infinite}
              .sp{animation:spark 1.7s ease-out infinite}
              .logic{stroke-dasharray:4 6;animation:dash 2s linear infinite}
              .st{animation:settle 4s ease-in-out infinite}
              .gate{animation:gatePulse 4.5s ease-in-out infinite}
              .gpath{animation:pathGlow 3.6s ease-in-out infinite}
            </style>
          </defs>

          <g class="scene-float">
            <rect width="520" height="340" fill="url(#dome)" opacity=".8"/>
            <g opacity=".9">
              <path class="ray" d="M260 40 L 190 150 L 210 150 Z" fill="#fff8e8"/>

            </g>
            <ellipse class="arena-fill" cx="260" cy="284" rx="188" ry="42"/>

            <line x1="72" y1="284" x2="448" y2="284" stroke="rgba(138,90,59,.06)"/>
            <g class="aud">
              <g opacity=".8"><ellipse cx="46" cy="268" rx="5.5" ry="6.5"/><rect x="41" y="274" width="10" height="12" rx="3.5"/></g>
              <g opacity=".7"><ellipse cx="68" cy="258" rx="5" ry="6"/><rect x="63.5" y="264" width="9" height="11" rx="3"/></g>
              <g opacity=".65"><ellipse cx="92" cy="250" rx="4.8" ry="5.8"/><rect x="87.7" y="255.5" width="8.6" height="10" rx="3"/></g>
              <g opacity=".8"><ellipse cx="474" cy="268" rx="5.5" ry="6.5"/><rect x="469" y="274" width="10" height="12" rx="3.5"/></g>
              <g opacity=".7"><ellipse cx="452" cy="258" rx="5" ry="6"/><rect x="447.5" y="264" width="9" height="11" rx="3"/></g>

              <g opacity=".5"><ellipse cx="404" cy="244" rx="4.2" ry="5"/><rect x="400.2" y="249" width="7.6" height="9" rx="2.5"/></g>
            </g>

            <g class="act act1">
              <ellipse class="ringB" cx="260" cy="286" rx="62" ry="15" fill="none" stroke="rgba(201,164,92,.58)" stroke-width="2.2" filter="url(#glow)"/>
              <ellipse cx="260" cy="286" rx="62" ry="15" fill="none" stroke="rgba(255,248,230,.2)" stroke-width="1"/>
              <ellipse cx="260" cy="286" rx="44" ry="10.5" fill="none" stroke="rgba(201,164,92,.18)" stroke-width="1"/>
              <g transform="translate(260 274)">
                <ellipse class="shadow" cx="0" cy="16" rx="26" ry="6"/>
                <path class="figA" d="M-21 12 C -22 -14, -14 -46, 0 -53 C 14 -46, 22 -14, 21 12 Q 0 18 -21 12 Z"/>
                <path d="M-12 -28 Q 0 -40 12 -28" fill="none" stroke="rgba(255,252,247,.32)" stroke-width="1.2"/>
                <path d="M-8 -8 Q 0 -2 8 -8" fill="none" stroke="rgba(138,90,59,.1)" stroke-width="1"/>
                <circle class="hd" cx="1" cy="-66" r="12.5"/>
                <path d="M-7 -75 Q 1 -82 10 -75 Q 9 -68 5 -66 Q -3 -66 -7 -70 Z" fill="rgba(232,224,214,.72)" stroke="rgba(59,33,22,.1)" stroke-width=".5"/>
                <path d="M7 -69 Q 12 -66 7 -63" fill="none" stroke="rgba(59,33,22,.18)" stroke-width=".6"/>

                <circle cx="47" cy="-53" r="2.2" fill="rgba(201,164,92,.25)" stroke="rgba(201,164,92,.35)" stroke-width=".6"/>
              </g>
              <g class="b1"><circle cx="168" cy="178" r="16" fill="rgba(255,252,247,.11)" stroke="rgba(215,184,148,.3)" stroke-width="1"/><circle class="fk" cx="168" cy="178" r="16" fill="rgba(255,250,240,.06)"/></g>

              <g class="b3"><circle cx="210" cy="128" r="10.5" fill="rgba(255,252,247,.09)" stroke="rgba(215,184,148,.24)" stroke-width="1"/><circle class="fk" cx="210" cy="128" r="10.5" fill="rgba(255,250,240,.04)" style="animation-delay:1.1s"/></g>
              <g class="b4"><circle cx="304" cy="118" r="9" fill="rgba(255,252,247,.08)" stroke="rgba(215,184,148,.22)" stroke-width="1"/><circle class="fk" cx="304" cy="118" r="9" fill="rgba(255,250,240,.04)" style="animation-delay:1.7s"/></g>
              <g class="b5"><circle cx="136" cy="144" r="8" fill="rgba(255,252,247,.07)" stroke="rgba(215,184,148,.2)" stroke-width="1"/></g>
              <g class="b6"><circle cx="384" cy="146" r="11" fill="rgba(255,252,247,.08)" stroke="rgba(215,184,148,.22)" stroke-width="1"/><circle class="fk" cx="384" cy="146" r="11" fill="rgba(255,250,240,.04)" style="animation-delay:2s"/></g>
            </g>

            <g class="act act2">
              <ellipse cx="260" cy="286" rx="62" ry="15" fill="none" stroke="rgba(201,164,92,.28)" stroke-width="1.6"/>
              <g class="scaleArm" filter="url(#glow)">
                <line x1="260" y1="112" x2="260" y2="136" stroke="rgba(201,164,92,.48)" stroke-width="1.3"/>
                <line x1="220" y1="136" x2="300" y2="136" stroke="rgba(201,164,92,.55)" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M220 136 L 211 150 L 229 150 Z" fill="none" stroke="rgba(201,164,92,.48)" stroke-width="1.1"/>
                <path d="M300 136 L 291 150 L 309 150 Z" fill="none" stroke="rgba(201,164,92,.48)" stroke-width="1.1"/>
                <circle cx="260" cy="136" r="3" fill="rgba(201,164,92,.3)"/>
                <line x1="220" y1="136" x2="220" y2="150" stroke="rgba(201,164,92,.22)" stroke-width=".8"/>
                <line x1="300" y1="136" x2="300" y2="150" stroke="rgba(201,164,92,.22)" stroke-width=".8"/>

    <section class="auth-card" aria-label="Sign in or register">
      <div id="alreadyBox" class="already">
        <strong>Signed-in session detected</strong>
        <div id="alreadyText"></div>
        <div class="row">
          <a class="link-btn" href="/app">Open App</a>
          <button type="button" class="ghost-btn" id="switchAccount">Switch Account</button>
        </div>
      </div>
      <div class="tabs" role="tablist" aria-label="Authentication">
        <button type="button" class="tab active" data-tab="login" role="tab" aria-selected="true">Sign In</button>
        <button type="button" class="tab" data-tab="register" role="tab" aria-selected="false">Register</button>
      </div>
      <div id="panel-login" class="panel active" role="tabpanel">
        <h2>Welcome back</h2>
        <p class="hint">Sign in to start.</p>
        <form id="loginForm">
          <label>Username<input id="loginUser" name="username" autocomplete="username" required /></label>
          <label>Password<input id="loginPass" name="password" type="password" autocomplete="current-password" required /></label>
          <button class="btn" type="submit" id="loginBtn">Sign In</button>
          <div id="loginMsg" class="msg" aria-live="polite"></div>
        </form>
        <div class="divider">Demo Accounts</div>
        <div class="demo">Teacher <code>teacher</code> / <code>ArgueTch_6065</code><br>Student <code>student</code> / <code>ArgueStu_6065</code></div>
      </div>
      <div id="panel-register" class="panel" role="tabpanel">
        <h2>Create an account</h2>
        <p class="hint">Sign up as a student.</p>
        <form id="registerForm">
          <label>Username<input id="regUser" name="username" autocomplete="username" minlength="2" maxlength="32" required /></label>
          <label>Display name (optional)<input id="regName" name="display_name" autocomplete="nickname" maxlength="32" placeholder="e.g. Alex Lee" /></label>
          <label>Password<input id="regPass" name="password" type="password" autocomplete="new-password" minlength="6" required /></label>
          <label>Confirm password<input id="regPass2" name="password2" type="password" autocomplete="new-password" minlength="6" required /></label>
          <button class="btn" type="submit" id="regBtn">Register</button>
          <div id="regMsg" class="msg" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>

  <script>
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var TOKEN_KEY = 'ac_token';
    document.querySelectorAll('.tab').forEach(function(btn){
      btn.addEventListener('click', function(){
        var t = btn.dataset.tab;
        document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('active', b===btn); b.setAttribute('aria-selected', b===btn?'true':'false'); });
        $('panel-login').classList.toggle('active', t==='login');
        $('panel-register').classList.toggle('active', t==='register');
      });
    });
    function setMsg(id, text, type){ var el=$(id); if(!el) return; el.textContent=text||''; el.className='msg'+(type?' '+type:''); }
    async function post(url, body){
      var res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      var data = {}; try{ data = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((data && (data.detail||data.message)) || ('Request failed ('+res.status+')'));
      return data;
    }
    function enterApp(data){ if(data && data.token){ localStorage.setItem(TOKEN_KEY, data.token); } window.location.href = '/app'; }
    (async function(){
      var token = localStorage.getItem(TOKEN_KEY); if(!token) return;
      try{
        var res = await fetch('/api/auth/me', {headers:{'Authorization':'Bearer '+token}});
        var data = await res.json();
        if(data && data.user){ $('alreadyBox').style.display='block'; $('alreadyText').innerHTML = 'Current account: <strong>' + (data.user.display_name||data.user.username) + '</strong> (' + (data.user.role==='teacher'?'Teacher':'Student') + ')'; }
        else { localStorage.removeItem(TOKEN_KEY); }
      }catch(e){}
    })();
    $('switchAccount').addEventListener('click', async function(){
      var token = localStorage.getItem(TOKEN_KEY);
      if(token){ try{ await fetch('/api/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+token}}); }catch(e){} }
      localStorage.removeItem(TOKEN_KEY); $('alreadyBox').style.display='none';
    });
    $('loginForm').addEventListener('submit', async function(e){
      e.preventDefault(); setMsg('loginMsg','Signing in...'); $('loginBtn').disabled = true;
      try{ var data = await post('/api/auth/login', {username:$('loginUser').value.trim(), password:$('loginPass').value}); setMsg('loginMsg','Signed in. Redirecting…','ok'); enterApp(data); }
      catch(err){ setMsg('loginMsg', err.message||'Sign-in failed', 'err'); } finally{ $('loginBtn').disabled = false; }
    });
    $('registerForm').addEventListener('submit', async function(e){
      e.preventDefault();
      var u=$('regUser').value.trim(), n=$('regName').value.trim(), p=$('regPass').value, p2=$('regPass2').value;
      if(p!==p2){ setMsg('regMsg','Passwords do not match','err'); return; }
      setMsg('regMsg','Creating account...'); $('regBtn').disabled = true;
      try{ var data = await post('/api/auth/register', {username:u, password:p, display_name:n||u}); setMsg('regMsg','Registered. Redirecting…','ok'); enterApp(data); }
      catch(err){ setMsg('regMsg', err.message||'Registration failed', 'err'); } finally{ $('regBtn').disabled = false; }
    });
  })();
  </script>
</body>
